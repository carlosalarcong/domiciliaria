framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: true
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed:
                dsn: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Procesados por worker (cron diario o no urgente)
            App\Message\TurnoDescubiertoMessage: async
            App\Message\RevisarTurnosDescubiertosMessage: async
            App\Message\BackupDatabaseMessage: async
            App\Message\DocumentoVencimientoMessage: async
            # Notificaciones síncronas: in-app inmediata (evento grave, responsable asignado, cambio estado)
            # EventoAdversoGraveMessage, EventoResponsableAsignadoMessage y PacienteEstadoCambioMessage
            # sin routing → sync por defecto

parameters:
    app.upload_dir: '%kernel.project_dir%/public/uploads/trabajadores'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # ── Redis ──────────────────────────────────────────────────────────────────

    redis_client:
        class: Predis\Client
        arguments:
            - '%env(REDIS_URL)%'

    Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
        arguments:
            - '@redis_client'
            - { prefix: 'sess_', ttl: 1800 }

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ── Encryption ────────────────────────────────────────────────────────────

    App\Service\EncryptionService:
        arguments:
            $encryptionKey: '%env(APP_ENCRYPTION_KEY)%'

    App\Command\EncryptExistingDataCommand:
        arguments:
            $defaultEm: '@doctrine.orm.default_entity_manager'
            $tenantEm:  '@doctrine.orm.tenant_entity_manager'

    App\Command\RotateEncryptionKeyCommand:
        arguments:
            $em: '@doctrine.orm.tenant_entity_manager'

    # ── Rate Limiter ──────────────────────────────────────────────────────────

    App\EventListener\RateLimitListener:
        arguments:
            $loginLimiter:  '@limiter.login_limiter'
            $apiLimiter:    '@limiter.api_limiter'
            $exportLimiter: '@limiter.export_limiter'

    Doctrine\ORM\EntityManagerInterface:
        alias: doctrine.orm.tenant_entity_manager
        public: false

    Gedmo\Loggable\LoggableListener:
        alias: stof_doctrine_extensions.listener.loggable
        public: false

    App\Service\TrabajadorService:
        arguments:
            $uploadDir: '%app.upload_dir%'

    # ── Multi-tenancy ──────────────────────────────────────────────────────────

    App\Service\TenantResolver:
        arguments:
            $centralDbUrl: '%env(DATABASE_URL)%'

    App\Service\TenantContext:
        arguments:
            $requestStack: '@request_stack'
            $centralDbUrl: '%env(DATABASE_URL)%'

    App\Service\CustomTenantConfigProvider:
        arguments:
            $tenantResolver: '@App\Service\TenantResolver'

    Hakam\MultiTenancyBundle\Port\TenantConfigProviderInterface:
        alias: App\Service\CustomTenantConfigProvider
        public: false

    # Forzar el EM default para los servicios de hakam que manejan TenantDb
    Hakam\MultiTenancyBundle\Adapter\Doctrine\DoctrineTenantDatabaseManager:
        arguments:
            $entityManager: '@doctrine.orm.default_entity_manager'

    Hakam\MultiTenancyBundle\Adapter\Doctrine\DoctrineTenantConfigProvider:
        arguments:
            $entityManager: '@doctrine.orm.default_entity_manager'

    App\EventListener\TenantDatabaseSwitchListener:
        arguments:
            $tenantResolver:  '@App\Service\TenantResolver'
            $tenantContext:   '@App\Service\TenantContext'
            $eventDispatcher: '@event_dispatcher'
            $logger:          '@logger'
        tags:
            - { name: kernel.event_subscriber }

    App\EventListener\AuthenticationListener:
        arguments:
            $tenantContext: '@App\Service\TenantContext'
        tags:
            - { name: kernel.event_subscriber }

    App\EventSubscriber\DynamicControllerSubscriber:
        arguments:
            $tenantContext:       '@App\Service\TenantContext'
            $logger:              '@logger'
            $excludedControllers: []
            $excludedNamespaces:  []
        tags:
            - { name: kernel.event_subscriber }

    App\Command\TenantCrearCommand:
        arguments:
            $em:           '@doctrine.orm.default_entity_manager'
            $centralDbUrl: '%env(DATABASE_URL)%'
        tags:
            - { name: console.command }

    App\Command\TenantMigrateAllCommand:
        arguments:
            $em: '@doctrine.orm.default_entity_manager'
        tags:
            - { name: console.command }

    App\MessageHandler\BackupDatabaseHandler:
        arguments:
            $dbHost:     '%env(PGHOST)%'
            $dbPort:     '%env(PGPORT)%'
            $dbUser:     '%env(PGUSER)%'
            $dbPassword: '%env(PGPASSWORD)%'
            $s3Bucket:   '%env(default::AWS_S3_BUCKET)%'
            $s3Region:   '%env(default::AWS_DEFAULT_REGION)%'

    App\Scheduler\BackupSchedule:
        arguments:
            $defaultEm: '@doctrine.orm.default_entity_manager'
            $cache:     '@cache.redis'

    # ── API pública ────────────────────────────────────────────────────────────

    App\Command\GenerateApiTokenCommand:
        arguments:
            $defaultEm: '@doctrine.orm.default_entity_manager'
            $tenantEm:  '@doctrine.orm.tenant_entity_manager'
        tags:
            - { name: console.command }

    App\Command\CerrarTurnosParcialVencidosCommand:
        arguments:
            $defaultEm: '@doctrine.orm.default_entity_manager'
            $tenantEm: '@doctrine.orm.tenant_entity_manager'

    App\MessageHandler\CerrarTurnosParcialesVencidosHandler:
        arguments:
            $defaultEm: '@doctrine.orm.default_entity_manager'
            $tenantEm: '@doctrine.orm.tenant_entity_manager'

    App\MessageHandler\MarcarFacturasVencidasHandler:
        arguments:
            $defaultEm: '@doctrine.orm.default_entity_manager'
            $tenantEm: '@doctrine.orm.tenant_entity_manager'

    App\Security\ApiTokenAuthenticator:
        arguments:
            $tokenRepository: '@App\Repository\Tenant\ApiTokenRepository'

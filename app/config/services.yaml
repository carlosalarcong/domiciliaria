parameters:
    app.upload_dir: '%kernel.project_dir%/public/uploads/trabajadores'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\TrabajadorService:
        arguments:
            $uploadDir: '%app.upload_dir%'


services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
      - redis
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://app:secret@postgres:5432/domiciliaria?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      TENANT_DB_USER: "app"
      TENANT_DB_PASSWORD: "secret"
      TENANT_DB_HOST: "postgres"

  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: domiciliaria
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:

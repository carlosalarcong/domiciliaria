services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html:cached
    depends_on:
      - postgres
      - redis
      - mailpit
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://app:secret@postgres:5432/domiciliaria?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      TENANT_DB_USER: "app"
      TENANT_DB_PASSWORD: "secret"
      TENANT_DB_HOST: "postgres"
      MAILER_DSN: "smtp://mailpit:1025"

  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: domiciliaria
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  php-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php /var/www/html/app/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M -vv
    restart: unless-stopped
    volumes:
      - .:/var/www/html:cached
    depends_on:
      - postgres
      - redis
      - mailpit
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://app:secret@postgres:5432/domiciliaria?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      TENANT_DB_USER: "app"
      TENANT_DB_PASSWORD: "secret"
      TENANT_DB_HOST: "postgres"
      MAILER_DSN: "smtp://mailpit:1025"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  pgdata:

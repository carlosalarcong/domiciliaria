# ── Security headers globales ──────────────────────────────────────────────────
map $sent_http_content_type $csp_header {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none';";
}

# Dominio principal
server {
    listen 80;
    server_name localhost;
    root /var/www/html/app/public;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy $csp_header always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME    $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT      $realpath_root;
        fastcgi_param HTTP_HOST          $http_host;
        fastcgi_param SERVER_PORT        8090;
        fastcgi_param X_FORWARDED_PORT   8090;
        internal;
    }

    location ~ \.php$ { return 404; }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}

# Subdominios wildcard *.localhost — cada tenant en su propio subdominio
server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.localhost$;
    root /var/www/html/app/public;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

        fastcgi_param HTTP_HOST          $http_host;
        fastcgi_param SERVER_PORT        8090;
        fastcgi_param X_FORWARDED_PORT   8090;
        internal;
    }

    location ~ \.php$ { return 404; }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
